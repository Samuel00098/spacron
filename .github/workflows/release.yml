name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example 4.0.0 or v4.0.0'
        required: true
        type: string

jobs:
  # Create the release in spacron-releases before the matrix builds run,
  # because tauri-action requires the release to already exist in the target repo
  # to avoid target_commitish validation errors (since the build commit does not
  # exist in the releases repo).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate release tag
        id: resolve
        env:
          TAG_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          # Strict validation: the tag is used by bash below and the job env
          # holds RELEASE_TOKEN plus the updater signing key, so anything that
          # isn't a clean semver tag aborts before it ever reaches a shell.
          # `inputs.tag` and `github.ref_name` are NEVER interpolated into bash
          # directly — the value crosses into the shell only via this env var
          # after the regex passes.
          if [[ ! "$TAG_CANDIDATE" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: '$TAG_CANDIDATE' (expected <major>.<minor>.<patch> with an optional v prefix)" >&2
            exit 1
          fi
          echo "tag=$TAG_CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Create release in spacron-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # Check if the release already exists in spacron-releases
          if gh release view "$TAG" --repo Samuel00098/spacron-releases >/dev/null 2>&1; then
            echo "Release $TAG already exists in spacron-releases, continuing."
          else
            echo "Creating release $TAG in spacron-releases..."
            gh release create "$TAG" \
              --repo Samuel00098/spacron-releases \
              --title "Spacron $TAG" \
              --notes "See the changelog for what is new in this release." \
              --target main
          fi

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest  # GitHub hosted — free for public repos
            os: windows
            args: ''
            rust-targets: ''

          - platform: macos-26       # macOS Apple Silicon (arm64)
            os: macos
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'

          - platform: ubuntu-22.04   # Linux x86_64
            os: linux
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) so a
      # compromise of an action's repo can't change what this workflow runs.
      # Update deliberately: bump to the new tag's SHA after review.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Workflow dispatch runs from the branch containing this workflow;
          # release artifacts must instead be built from the requested tag.
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Pin npm explicitly so tauri-action never auto-detects another package manager
          tauriScript: npm run tauri
          # Publish the release to the separate public releases repo
          owner: Samuel00098
          repo: spacron-releases
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Spacron ${{ needs.prepare.outputs.tag }}"
          releaseBody: 'See the changelog for what is new in this release.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Publish this leg's headless server as its own release asset.
      #
      # Why it has to be here rather than in a build job of its own: an
      # installer only ever carries the sidecar for the OS it was built on, so
      # a Windows install had no way to deploy to a Linux VPS without a local
      # Rust + zig cross-build. The wizard's "Get the Linux server" button
      # downloads this asset instead (see `remote_download_server`), and one
      # asset per matrix leg is exactly the set of platforms it can offer.
      #
      # No second cargo build: tauri's `beforeBuildCommand` already produced
      # `binaries/spacron-server-<host triple>` during the step above. This
      # only names, hashes and uploads it.
      - name: Publish spacron-server artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # `tr -d '\r'` because this runs under Git Bash on the Windows leg,
          # where rustc's output is CRLF and the stray CR would corrupt the
          # asset name.
          triple="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
          ext=""
          case "$triple" in *windows*) ext=".exe" ;; esac
          asset="spacron-server-${triple}${ext}"
          dir="src-tauri/binaries"
          if [ ! -f "$dir/$asset" ]; then
            echo "Expected $dir/$asset to exist after the build." >&2
            ls -la "$dir" || true
            exit 1
          fi
          # The client refuses to deploy a download whose digest doesn't match,
          # so the sidecar file is not optional. macOS has no sha256sum.
          (
            cd "$dir"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" | cut -d' ' -f1 > "$asset.sha256"
            else
              shasum -a 256 "$asset" | cut -d' ' -f1 > "$asset.sha256"
            fi
          )
          # --clobber so re-running a release replaces the assets instead of
          # failing on the second attempt.
          gh release upload "$TAG" "$dir/$asset" "$dir/$asset.sha256" \
            --repo Samuel00098/spacron-releases --clobber
