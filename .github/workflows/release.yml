name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example 5.0.0 or v5.0.0'
        required: true
        type: string

jobs:
  # Create the release in spacron-releases before the matrix builds run,
  # because tauri-action requires the release to already exist in the target repo
  # to avoid target_commitish validation errors (since the build commit does not
  # exist in the releases repo).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - name: Resolve and validate release tag
        id: resolve
        env:
          TAG_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          # Strict validation: the tag is used by bash below and the job env
          # holds RELEASE_TOKEN plus the updater signing key, so anything that
          # isn't a clean semver tag aborts before it ever reaches a shell.
          # `inputs.tag` and `github.ref_name` are NEVER interpolated into bash
          # directly — the value crosses into the shell only via this env var
          # after the regex passes.
          if [[ ! "$TAG_CANDIDATE" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: '$TAG_CANDIDATE' (expected <major>.<minor>.<patch> with an optional v prefix)" >&2
            exit 1
          fi
          echo "tag=$TAG_CANDIDATE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # This version's CHANGELOG section: the release body, and the notes the
      # app shows on its title bar before installing the update.
      - name: Extract release notes
        id: notes
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          node scripts/release-notes.js "$TAG" > release-notes.md
          delimiter="NOTES_$(openssl rand -hex 16)"
          {
            echo "body<<$delimiter"
            cat release-notes.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create release in spacron-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # Check if the release already exists in spacron-releases
          if gh release view "$TAG" --repo Samuel00098/spacron-releases >/dev/null 2>&1; then
            echo "Release $TAG already exists in spacron-releases, continuing."
          else
            echo "Creating release $TAG in spacron-releases..."
            gh release create "$TAG" \
              --repo Samuel00098/spacron-releases \
              --title "Spacron $TAG" \
              --notes-file release-notes.md \
              --target main
          fi

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest  # GitHub hosted — free for public repos
            os: windows
            args: ''
            rust-targets: ''

          # Windows on ARM (Snapdragon etc.), cross-compiled on the x64 runner.
          # NSIS only: WiX 3 cannot produce an ARM64 .msi.
          - platform: windows-latest
            os: windows-arm64
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
            rust-targets: 'aarch64-pc-windows-msvc'

          - platform: macos-26       # macOS Apple Silicon (arm64)
            os: macos
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'

          - platform: ubuntu-22.04   # Linux x86_64
            os: linux
            args: ''
            rust-targets: ''

          # Linux on 64-bit ARM, built natively on GitHub's ARM runner (free for
          # public repos). Also publishes the aarch64 server that the VPS
          # wizard's "Linux (ARM)" platform downloads.
          - platform: ubuntu-22.04-arm
            os: linux-arm64
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) so a
      # compromise of an action's repo can't change what this workflow runs.
      # Update deliberately: bump to the new tag's SHA after review.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Workflow dispatch runs from the branch containing this workflow;
          # release artifacts must instead be built from the requested tag.
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Windows on ARM is cross-compiled on the x64 runner (native ARM runners
      # are not free for this private repo). whisper.cpp's ggml refuses MSVC for
      # ARM ("use clang"), so C/C++ for the ARM64 target builds with clang-cl
      # from VS's LLVM component, inside a vcvars x64_arm64 environment so CMake
      # finds the ARM64 SDK libraries. `/EHsc` must be spelled out: cmake-rs
      # replaces CMAKE_CXX_FLAGS, and clang-cl rejects ggml's `try` without it.
      # See .spacron/memory/windows-arm64-whisper-build.md.
      - name: Set up Windows ARM64 cross toolchain
        if: matrix.os == 'windows-arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the ARM64 build tools was not found on this runner' }
          $llvm = "$vs\VC\Tools\Llvm\x64\bin"
          if (-not (Test-Path "$llvm\clang-cl.exe")) { throw "clang-cl not found at $llvm" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" x64_arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          $llvm, "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          @(
            'CMAKE_GENERATOR=Ninja'
            'CC_aarch64_pc_windows_msvc=clang-cl'
            'CXX_aarch64_pc_windows_msvc=clang-cl'
            'CFLAGS_aarch64_pc_windows_msvc=--target=arm64-pc-windows-msvc'
            'CXXFLAGS_aarch64_pc_windows_msvc=--target=arm64-pc-windows-msvc /EHsc'
          ) | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Pin npm explicitly so tauri-action never auto-detects another package manager
          tauriScript: npm run tauri
          # Publish the release to the separate public releases repo
          owner: Samuel00098
          repo: spacron-releases
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Spacron ${{ needs.prepare.outputs.tag }}"
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Publish this leg's headless server as its own release asset.
      #
      # Why it has to be here rather than in a build job of its own: an
      # installer only ever carries the sidecar for the OS it was built on, so
      # a Windows install had no way to deploy to a Linux VPS without a local
      # Rust + zig cross-build. The wizard's "Get the Linux server" button
      # downloads this asset instead (see `remote_download_server`), and one
      # asset per matrix leg is exactly the set of platforms it can offer.
      #
      # No second cargo build: tauri's `beforeBuildCommand` already produced
      # `binaries/spacron-server-<target triple>` during the step above. This
      # only names, hashes and uploads it.
      - name: Publish spacron-server artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          # The leg's build target; empty means the host. A cross leg (Windows
          # ARM64 on the x64 runner) must publish the ARM64 server, not a second
          # copy of the host's.
          TARGET_TRIPLE: ${{ matrix.rust-targets }}
        run: |
          set -euo pipefail
          # `tr -d '\r'` because this runs under Git Bash on the Windows leg,
          # where rustc's output is CRLF and the stray CR would corrupt the
          # asset name.
          triple="${TARGET_TRIPLE:-$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')}"
          ext=""
          case "$triple" in *windows*) ext=".exe" ;; esac
          asset="spacron-server-${triple}${ext}"
          dir="src-tauri/binaries"
          if [ ! -f "$dir/$asset" ]; then
            echo "Expected $dir/$asset to exist after the build." >&2
            ls -la "$dir" || true
            exit 1
          fi
          # The client refuses to deploy a download whose digest doesn't match,
          # so the sidecar file is not optional. macOS has no sha256sum.
          (
            cd "$dir"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" | cut -d' ' -f1 > "$asset.sha256"
            else
              shasum -a 256 "$asset" | cut -d' ' -f1 > "$asset.sha256"
            fi
          )
          # --clobber so re-running a release replaces the assets instead of
          # failing on the second attempt.
          gh release upload "$TAG" "$dir/$asset" "$dir/$asset.sha256" \
            --repo Samuel00098/spacron-releases --clobber
