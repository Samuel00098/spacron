name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
            args: ''
            rust-targets: ''

          - platform: macos-26
            os: macos
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'

          - platform: ubuntu-22.04
            os: linux
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # Actions are pinned to full commit SHAs (not mutable tags). Update
      # deliberately: bump to the new tag's SHA after review.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Build frontend bundle
        run: npm run build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Runs on all three platforms deliberately. A large part of the backend is
      # platform-conditional — path canonicalisation and the Windows `\\?\`
      # prefix, symlink confinement (`#[cfg(unix)]` tests that cannot run on
      # Windows at all), shell detection, the PTY layer — so a suite that only
      # ever runs on the author's machine leaves the other two platforms
      # unverified. Before this step the matrix compiled three platforms and
      # tested none.
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app
        run: npm run tauri build -- --debug --no-bundle ${{ matrix.args }}
