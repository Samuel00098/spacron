<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.png?v=system-1" type="image/png" />
    <link rel="icon" href="/favicon-dark.png?v=system-1" type="image/png" media="(prefers-color-scheme: light)" />
    <!-- Preload the app UI + code faces so every panel paints with the real
         typeface from first boot instead of flashing a system fallback. -->
    <link rel="preload" href="/fonts/manrope-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-800.woff2" as="font" type="font/woff2" crossorigin />
    <title>Spacron</title>
    <!-- Cold launch only (same marker as src/lib/utils/coldLaunch.ts): paint the
         launch splash colour before any script loads, so the window doesn't
         flash white first. LaunchSplash removes it once the app is revealed. -->
    <script>
      try {
        if (!sessionStorage.getItem('spacron_launched')) {
          var mode = JSON.parse(localStorage.getItem('forge_setting_appearance') || '"system"');
          var light = mode === 'light' || (mode !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.style.background = light ? '#ffffff' : '#000000';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
