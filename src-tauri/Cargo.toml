# `src-tauri` is the workspace root; `server/` is the headless remote-workspace
# server. It lives in its own crate rather than as `src/bin/spacron-server.rs`
# because Tauri bundles every bin target of the app package *in addition to*
# every `bundle.externalBin` entry — which put the server in the Windows MSI
# twice and made WiX reject the package (ICE30). See server/Cargo.toml.
#
# `resolver = "2"` is explicit because a workspace does not inherit the
# resolver its root package's edition implies, and feature unification is
# load-bearing here: the server depends on this package with
# `default-features = false` to keep whisper/cmake out of its graph.
[workspace]
members = [".", "server"]
resolver = "2"

[package]
name = "spacron"
version = "1.0.0"
description = "A lightweight developer workspace built with Tauri 2, Rust, and React"
authors = ["samue"]
edition = "2021"
license-file = "../LICENSE"
publish = false
default-run = "spacron"

[lib]
name = "spacron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
window-vibrancy = "0.5"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1", features = ["full"] }
dashmap = "5"
notify = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
portable-pty = "0.8"
# Process-tree inspection for the PTY layer's kill-tree path
# (`pty/session.rs`), which must terminate an agent's whole child tree rather
# than just the shell it launched.
sysinfo = "0.39"
axum = { version = "0.8.9", features = ["ws"] }
reqwest = { version = "0.13.3", features = ["json", "stream", "gzip", "brotli", "cookies", "multipart", "form", "query"] }
# Same cookie stack reqwest's own `Jar` is built on — used to implement the
# preview proxy's disk-persisted cookie jar (default features keep `serde_json`
# for save_json/load_json).
cookie = "0.18"
cookie_store = "0.22"
# rustls so the preview proxy can bridge `wss://` websockets for proxied
# external sites (chat/collab web apps); plain local-dev `ws://` forwarding
# worked without TLS.
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
# TLS client for the remote-workspace relay (remote_relay.rs): the relay must
# terminate TLS itself because the WebView is CSP-limited to plaintext loopback.
# Already in the lockfile via tokio-tungstenite; promoted to a direct dep for the
# explicit import. Provider pinned to `ring`: the rest of the graph (updater,
# tungstenite) already enables rustls/ring, and aws-lc-rs would leave rustls with
# two providers, which makes `ClientConfig::builder()` panic.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# PEM parsing for the server's `--cert/--key` pair (remote/mod.rs TLS mode).
# Already in the lockfile transitively; promoted for the explicit import.
rustls-pemfile = "2"
# HTTP/1.1 auto server used by the TLS accept loop (remote/mod.rs serve_tls);
# axum 0.8's own `serve` does not speak TLS, so the TlsAcceptor feeds hyper-util.
# Already in the lockfile transitively; promoted for the explicit import.
hyper-util = { version = "0.1", features = ["server-auto", "http1", "tokio", "service"] }
# Verify upstream certs against the OS trust store (Windows/macOS cert stores,
# Linux nss/native) so self-signed CAs installed by the operator — the common
# cloud-VM case — validate alongside public ones. webpki-roots alone would reject
# every self-signed cert, which is useless for a box the operator controls. The
# `BuilderVerifierExt` trait supplies the `.with_platform_verifier()` builder step.
rustls-platform-verifier = "0.5"
futures-util = "0.3.32"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
ignore = "0.4"
regex = "1"
# SIMD substring search. Used by the agent rules-file probe, which scans agent
# binaries (grok.exe is ~138 MB) for embedded rules-file names — a naive
# byte-window scan made that take seconds. Already in the tree via `regex`.
memchr = "2"
# Native ONNX Runtime for offline Parakeet STT (runs in the app process instead
# of the WebKit renderer's WASM heap, which OOM-kills the web process on Linux).
#
# `load-dynamic` makes ort dlopen the ONNX Runtime shared library at runtime
# instead of static-linking it. The prebuilt static libs pyke ships for ORT 1.24
# (this rc) reference Abseil symbols that ort-sys fails to put on the final link
# line for the Linux GCC/ld toolchain, breaking the build with
# `undefined reference to absl::...::NominalCPUFrequency`. Dynamic loading sidesteps
# static linking entirely on every platform, which is why it is here and should
# stay until that link failure is fixed upstream.
#
# CORRECTION (2026-08-13). An earlier version of this comment claimed
# `download-binaries` + `copy-dylibs` "still fetch the dylib and copy it next to
# the built binary". They do not. `load-dynamic` enables `ort-sys/disable-linking`,
# and ort-sys's build script returns before doing anything at all when that is
# set — its own comment reads "we don't need to download anything because we
# don't provide DLLs anymore". Confirmed empirically: there is no onnxruntime
# library anywhere under `target/`.
#
# So NOTHING in this build produces an ONNX Runtime library, and the gap is not
# limited to release bundles — Parakeet STT cannot work in a dev build either
# unless the host already has ONNX Runtime on its loader search path. Worse, ort
# rc.12 reacts to a missing library by panicking
# (`load_dylib_from_path(..).expect("Failed to load ONNX Runtime dylib")`), and
# rc.12 has no `with_dylib_path` builder — `ORT_DYLIB_PATH` is the only lever.
#
# `commands/parakeet.rs::ensure_ort_dylib` resolves that variable from the models
# dir or the executable's directory and returns a clean error (never reaching the
# panic) when the library is absent, and `commands/onnx_runtime.rs` downloads the
# library itself — from Microsoft's official release, NOT from pyke's CDN, whose
# archives hold a 305 MB static `onnxruntime.lib` and no loadable DLL at all.
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
# Native whisper.cpp bindings for offline Whisper STT. Uses the GGML models the
# app already downloads; mmaps them so RAM stays low. Optional + gated behind the
# default-on `whisper-stt` feature: it compiles whisper.cpp from source and so
# needs `cmake` at build time. Build with `--no-default-features` to drop Whisper
# (and the cmake requirement) if needed.
whisper-rs = { version = "0.16", optional = true }
# Unpacking the ONNX Runtime release `commands/onnx_runtime.rs` downloads.
# Microsoft ships it as `.zip` for Windows and gzipped tar for macOS/Linux, so
# all three are needed. `tar` and `flate2` were already in `Cargo.lock`
# transitively; `zip` is limited to `deflate` because that is the only method
# these archives use.
tar = "0.4"
flate2 = "1.1.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }


[features]
# Whisper local STT is on by default but can be disabled to build without the
# cmake/whisper.cpp toolchain: `cargo build --no-default-features`.
default = ["whisper-stt"]
whisper-stt = ["dep:whisper-rs"]

[dev-dependencies]
tempfile = "3"
# Generates throwaway CAs/leaf certs for the relay's TLS end-to-end test (the
# production path verifies against the OS trust store; the test injects its own
# root store instead, so it never touches the machine's real trust).
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }

# Release binary size/perf. `strip` drops debug symbols (large win, no runtime
# cost); `lto` + single codegen unit shrink and often speed up the binary. Panic
# unwinding is kept (not "abort") so a panicking Tauri command returns an error
# instead of taking the whole app down. ML inference speed is unaffected — it
# lives in whisper.cpp / ONNX Runtime, not this crate.
[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["objc2", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSValue"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["block2", "objc2-app-kit", "objc2-core-foundation", "WKSnapshotConfiguration", "WKWebView"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18.5", features = ["png"] }
# v2_38 gates the media settings used in lib.rs (enable-webrtc & co.); wry
# already builds webkit2gtk with v2_40, so this adds no new requirement.
webkit2gtk = { version = "2.0.2", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.2"
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Environment",
    "Win32_System_Memory",
    # SetThreadExecutionState, for the keep-awake sleep inhibitor
    # (commands/keep_awake.rs).
    "Win32_System_Power",
    "Win32_System_Registry",
] }
