[package]
name = "spacron"
version = "0.7.0"
description = "A lightweight developer workspace built with Tauri 2, Rust, and React"
authors = ["samue"]
edition = "2021"
license-file = "../LICENSE"
publish = false
default-run = "spacron"

[lib]
name = "spacron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
window-vibrancy = "0.5"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1", features = ["full"] }
dashmap = "5"
notify = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
portable-pty = "0.8"
axum = { version = "0.8.9", features = ["ws"] }
reqwest = { version = "0.13.3", features = ["json", "stream", "gzip", "brotli", "cookies", "multipart"] }
# Same cookie stack reqwest's own `Jar` is built on — used to implement the
# preview proxy's disk-persisted cookie jar (default features keep `serde_json`
# for save_json/load_json).
cookie = "0.18"
cookie_store = "0.22"
# rustls so the preview proxy can bridge `wss://` websockets for proxied
# external sites (chat/collab web apps); plain local-dev `ws://` forwarding
# worked without TLS.
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.32"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
ignore = "0.4"
regex = "1"
# Native ONNX Runtime for offline Parakeet STT (runs in the app process instead
# of the WebKit renderer's WASM heap, which OOM-kills the web process on Linux).
#
# `load-dynamic` makes ort dlopen the ONNX Runtime shared library at runtime
# instead of static-linking it. The prebuilt static libs pyke ships for ORT 1.24
# (this rc) reference Abseil symbols that ort-sys fails to put on the final link
# line for the Linux GCC/ld toolchain, breaking the build with
# `undefined reference to absl::...::NominalCPUFrequency`. Dynamic loading sidesteps
# static linking entirely on every platform. `download-binaries` + `copy-dylibs`
# (default features) still fetch the dylib and copy it next to the built binary,
# and `preload-dylibs` (pulled in by `load-dynamic`) loads it from next to the
# binary at startup. NOTE: this fixes the build/link on all platforms and the
# `--no-bundle` CI job. Tauri release *bundles* must additionally ship this dylib
# next to the packaged binary (or point `ORT_DYLIB_PATH`/`ort::init().with_dylib_path`
# at it) for the installed app to load ONNX Runtime at runtime — still TODO.
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
# Native whisper.cpp bindings for offline Whisper STT. Uses the GGML models the
# app already downloads; mmaps them so RAM stays low. Optional + gated behind the
# default-on `whisper-stt` feature: it compiles whisper.cpp from source and so
# needs `cmake` at build time. Build with `--no-default-features` to drop Whisper
# (and the cmake requirement) if needed.
whisper-rs = { version = "0.16", optional = true }


[features]
# Whisper local STT is on by default but can be disabled to build without the
# cmake/whisper.cpp toolchain: `cargo build --no-default-features`.
default = ["whisper-stt"]
whisper-stt = ["dep:whisper-rs"]

[dev-dependencies]
tempfile = "3"

# Release binary size/perf. `strip` drops debug symbols (large win, no runtime
# cost); `lto` + single codegen unit shrink and often speed up the binary. Panic
# unwinding is kept (not "abort") so a panicking Tauri command returns an error
# instead of taking the whole app down. ML inference speed is unaffected — it
# lives in whisper.cpp / ONNX Runtime, not this crate.
[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["objc2", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSValue"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["block2", "objc2-app-kit", "objc2-core-foundation", "WKSnapshotConfiguration", "WKWebView"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18.5", features = ["png"] }
# v2_38 gates the media settings used in lib.rs (enable-webrtc & co.); wry
# already builds webkit2gtk with v2_40, so this adds no new requirement.
webkit2gtk = { version = "2.0.2", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.2"
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
] }
